<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeDown</title>
    <style>
      /* 全局重置，避免默认边距影响遮罩 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 全屏加载遮罩样式 */
      #loading-overlay {
        position: fixed; /* 固定定位，覆盖整个视口 */
        top: 0;
        left: 0;
        width: 100vw; /* 视口宽度 */
        height: 100vh; /* 视口高度 */
        background-color: #1976D2; /* 指定的蓝色 */
        z-index: 9999; /* 最高层级，确保覆盖所有内容 */
        display: flex;
        align-items: center;
        justify-content: center;
        color: white; /* 可选：如果需要加载文字/图标，设置文字颜色 */
        font-size: 1.2rem;
      }

      /* 遮罩隐藏状态 */
      #loading-overlay.hidden {
        opacity: 0;
        pointer-events: none; /* 隐藏后不阻挡交互 */
      }
    </style>
  </head>
  <body>
    <!-- 加载遮罩层 -->
    <div id="loading-overlay">
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // 方法1：监听页面加载完成（适合纯前端资源加载）
      window.addEventListener('load', () => {
        // 页面所有资源加载完成后隐藏遮罩
        const overlay = document.getElementById('loading-overlay');
        overlay.classList.add('hidden');
        // 可选：动画结束后移除元素（避免占用 DOM）
        setTimeout(() => overlay.remove(), 300);
      });

      // 方法2：给 React/Vue 等框架预留手动触发的全局函数
      // 在你的 main.jsx 中加载完成后调用 window.hideLoadingOverlay()
      window.hideLoadingOverlay = () => {
        const overlay = document.getElementById('loading-overlay');
        overlay.classList.add('hidden');
        setTimeout(() => overlay.remove(), 300);
      };
    </script>
  </body>
</html>
